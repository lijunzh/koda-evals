# Check of lijunzh/koda#1564 (remove the Delete tool) on Flash-Next (GPU
# only): the eight tasks of flashnext-063-check (8 of 8 at e0618c6) plus the
# four other tasks where Flash-Next used Delete in recorded runs
# (kata-api-migration, compact-reasoning-summary, provider-flag-base-url,
# behaviour-spec-after-compact). Local models used Delete about as often as
# `rm`, so this is where its removal could cost a task. The build also has
# #1562 and #1563.
#   bin/serve-gguf flashnext
#   ./target/release/koda-eval run runs/flashnext-1564-check.toml
#
# Result, 20261111T143540Z: 11 of 12. kata-api-migration, the task where
# Flash-Next used Delete most, passed in 3m37s. The miss,
# compact-reasoning-summary, hit the 60-minute limit, as in an earlier
# Flash-Next run. Deletion: 2 `rm` through Bash, no attempt to call the
# removed tool. Approvals: 1 destructive (a forced rm), 18 local mutations
# from the Safe-mode tasks.
name = "flashnext-1564-check"
tasks = [
  "bash-classifier-escapes",
  "bash-readonly-fail-closed",
  "bash-split-multibyte",
  "behaviour-shell-safety",
  "behaviour-shell-safety-control",
  "behaviour-validation-fidelity",
  "kata-async-blocking",
  "behaviour-poll-background",
  "kata-api-migration",
  "compact-reasoning-summary",
  "provider-flag-base-url",
  "behaviour-spec-after-compact",
]
repeats = 1
jobs = 1
memory = "memory/rust-project.md"
wall_secs = 3600

[[variants]]
name = "koda"
ref = "73b09fe"  # refactor/remove-delete-tool, the head of #1564

[[models]]
name = "flashnext"
provider = "llama-cpp"
base_url = "http://localhost:8080/v1"
model = "flashnext"
env = { KODA_MAX_CONTEXT_TOKENS = "262144", KODA_REASONING_EFFORT = "xhigh" }
