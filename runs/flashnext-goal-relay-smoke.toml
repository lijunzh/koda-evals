# Smoke test for runs/flashnext-goal-relay.toml: one self run, to see that
# a turn token budget ends each turn and the goal starts the next.
#
# Result, 20261120T134052Z: it doesn't, under koda exec. The budget stopped
# turn 1 as planned (22,715 of 20,000 tokens, 2m03s, error code
# tokenBudgetSpent, turn status "failed"), the goal stayed active, and
# koda exec ended the run there: headless.rs breaks out of its loop on any
# turn whose status isn't "completed" before it looks at the goal. Failed,
# 4 of 22 hidden checks. The host would have started the next turn (a
# BudgetSpent turn doesn't block a goal), so the TUI and koda exec disagree.
# flashnext-goal-relay*.toml wait on that; the background chain
# (runs/flashnext-goal-pipeline*.toml) needs no imposed limit.
name = "flashnext-goal-relay-smoke"
tasks = ["behaviour-goal-toolkit"]
repeats = 1
jobs = 1

[[variants]]
name = "self"
ref = "83f458f"
args = ["-c", "turn_token_budget=20000", "-c", "max_goal_token_budget=200000"]

[[models]]
name = "flashnext"
provider = "llama-cpp"
base_url = "http://localhost:8080/v1"
model = "flashnext"
env = { KODA_MAX_CONTEXT_TOKENS = "262144", KODA_REASONING_EFFORT = "xhigh" }
