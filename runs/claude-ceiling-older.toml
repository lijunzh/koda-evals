# Ceiling control, not a gate and not the baseline: the 16 tasks already
# validated by Sonnet through Koda (the original ten plus the six built
# 2026-10-30), once each on Claude Code with Opus through bin/claude-as-koda,
# on Lijun's subscription. Two purposes (decided 2026-10-30): one "best
# available agent" row across the whole suite next to the Koda rows, and the
# wrapper's first run on Koda history checkouts (CLAUDE.md stripping, large
# repo, long cargo builds), which the fixture screens never exercised.
# Draws on Lijun's Claude quota; start only with his go-ahead. Times are
# contended at --jobs 3 and are not scoreboard numbers.
#   cargo run --release -- run runs/claude-ceiling-older.toml --jobs 3
#
# Result 2026-10-30 (results/claude-ceiling-older/20261030T142347Z): 16 of 16
# passed; katas in under a minute, history tasks 1 to 21 minutes under
# contention. Wrapper observations recorded in the vault growth-plan note:
# Opus edited mostly through Bash (python/sed/cat) after one denied Edit, so
# the Edit counts and any no_edit predicate are unreliable for Claude Code
# rows; it also read Koda's CLAUDE.md from disk, which --setting-sources ""
# does not prevent.
name = "claude-ceiling-older"
tasks = [
    "bash-classifier-escapes",
    "bash-readonly-fail-closed",
    "bash-split-multibyte",
    "compact-reasoning-summary",
    "composer-wrap-width-zero",
    "edit-stale-after-own-edit",
    "kata-api-migration",
    "kata-largest",
    "kata-preview-utf8",
    "kata-utf8-sweep",
    "loop-guard-char-boundary",
    "provider-flag-base-url",
    "provider-flags-beat-saved",
    "strip-quotes-lone-quote",
    "think-tag-multibyte",
    "vim-normal-mode-bugs",
]
repeats = 1
wall_secs = 1800

[[variants]]
name = "claude-code"
bin = "~/repo/koda-evals/bin/claude-as-koda"

[[models]]
name = "opus"
provider = "claude-subscription"
model = "opus"
engine = "claude-code-subscription"
