# vault-fix-renamed-links on Qwen3.8-Flash-Next after lijunzh/koda#1545
# (Lijun's yes, 2026-11-09), beside capability-koda-haiku-vault. The task's
# settings (`memory = "none"`, half an hour) with the local model's: the 256K
# window, `xhigh` effort, one request at a time.
#   bin/serve-gguf flashnext
#   ./target/release/koda-eval run runs/flashnext-061-vault.toml
#
# Result, 20261109T123934Z: 3 of 3 at 3m49s a run, with no Edit refused.
name = "flashnext-061-vault"
tasks = ["vault-fix-renamed-links"]
repeats = 3
jobs = 1
memory = "none"
wall_secs = 1800

[[variants]]
name = "koda"
ref = "425d8c2"  # main: the 0.6.1 candidate, with lijunzh/koda#1545

[[models]]
name = "flashnext"
provider = "llama-cpp"
base_url = "http://localhost:8080/v1"
model = "flashnext"
env = { KODA_MAX_CONTEXT_TOKENS = "262144", KODA_REASONING_EFFORT = "xhigh" }
