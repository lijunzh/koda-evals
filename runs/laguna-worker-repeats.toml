# Two more passes of the Laguna worker screen, for pass^3 together with the
# single runs in results/laguna-worker-screen/20261029T213000Z and
# results/laguna-worker-screen-rest/20261029T225523Z (2 of 4 there: both
# provider-flag-base-url and vim-normal-mode-bugs passed, the other two ran
# out their hour). Same conditions: worker (an hour a task, 128K pin), Laguna
# S 2.1 oQ4e on oMLX, machine otherwise idle.
#   omlx start && cargo run --release -- run runs/laguna-worker-repeats.toml && omlx stop
name = "laguna-worker-repeats"
tasks = ["bash-classifier-escapes", "composer-wrap-width-zero", "provider-flag-base-url", "vim-normal-mode-bugs"]
repeats = 2
wall_secs = 3600

[[variants]]
name = "main"
ref = "main"

[[models]]
name = "laguna"
provider = "lm-studio"
base_url = "http://127.0.0.1:8123/v1"
model = "mlx-community/Laguna-S-2.1-oQ4e"
env = { KODA_MAX_CONTEXT_TOKENS = "131072" }
