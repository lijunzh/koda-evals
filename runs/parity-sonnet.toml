# Optional, alongside 0.6.0's bar: Koda against Claude Code on Sonnet, the 31
# `suite` tasks once, both reading the short memory/rust-project.md. It shows
# whether a gap on Haiku is the model's or Koda's. Koda's runs are paid API
# calls; Claude Code's use the subscription. Each run needs Lijun's yes. Pin
# `ref` to the release candidate's commit before running.
#   ./target/release/koda-eval run runs/parity-sonnet.toml
name = "parity-sonnet"
repeats = 1
tags = ["suite"]
jobs = 3
memory = "memory/rust-project.md"

[[variants]]
name = "koda"
ref = "main"

[[variants]]
name = "claude-code"
bin = "~/repo/koda-evals/bin/claude-as-koda"

[[models]]
name = "sonnet"
provider = "anthropic"
model = "claude-sonnet-5-5"
# Claude Code reads the project's CLAUDE.md only with this; koda ignores it.
env = { CLAUDE_AS_KODA_MEMORY = "project" }
