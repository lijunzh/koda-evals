# Optional, alongside 0.6.0's bar: Koda against Claude Code on Sonnet, the 31
# `suite` tasks once, both reading the short memory/rust-project.md. It shows
# whether a gap on Haiku is the model's or Koda's. Koda's runs are paid API
# calls; Claude Code's use the subscription. Each run needs Lijun's yes.
# `ref` is pinned to the release candidate.
#
# Each agent keeps its own defaults, since the question is what a user gets.
# Koda sends no effort, so Sonnet 5.5's API default of `high` applies.
# Claude Code 2.1.296 sends `medium` with adaptive thinking (captured against a
# local stub on 2026-11-03), so on Sonnet the two don't think alike.
#   ./target/release/koda-eval run runs/parity-sonnet.toml
name = "parity-sonnet"
repeats = 1
tags = ["suite"]
jobs = 3
memory = "memory/rust-project.md"

[[variants]]
name = "koda"
ref = "522daac5ab7e76d15cc46b4bccafd31702c99e2f"  # the 0.6.0 release candidate, after the tool fixes (lijunzh/koda#1511-#1514)

[[variants]]
name = "claude-code"
bin = "~/repo/koda-evals/bin/claude-as-koda"

[[models]]
name = "sonnet"
provider = "anthropic"
model = "claude-sonnet-5-5"
# Claude Code reads the project's CLAUDE.md only with this; koda ignores it.
env = { CLAUDE_AS_KODA_MEMORY = "project" }
