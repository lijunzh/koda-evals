# Step 8 of the 0.7.x parity plan (Lijun approved the plan and its tests,
# 2026-11-20): Koda against Codex on the local default model, the `suite`
# tasks × 3, as runs/parity-ornith.toml was for 0.6.0 (79 against 75 of 93
# on Ornith, 2026-11-04). Flash-Next on llama-server at its 262K window and
# `xhigh`, both agents reading memory/rust-project.md (Codex as AGENTS.md).
# Codex 0.171.0 reaches llama-server's Responses route through
# bin/codex-as-koda (CODEX_OSS_BASE_URL; checked by
# runs/parity-flashnext-smoke.toml, 1 of 1). Koda at lijunzh/koda main
# 281c68f: steps 1-5 of the plan; steps 6-7 (MCP resource tools, /rewind)
# don't touch what these tasks exercise. One at a time; GPU only.
#   bin/serve-gguf flashnext
#   ./target/release/koda-eval run runs/parity-flashnext.toml
name = "parity-flashnext"
repeats = 3
tags = ["suite"]
jobs = 1
memory = "memory/rust-project.md"

[[variants]]
name = "koda"
ref = "281c68f"  # main after lijunzh/koda#1737

[[variants]]
name = "codex"
bin = "~/repo/koda-evals/bin/codex-as-koda"

[[models]]
name = "flashnext"
provider = "llama-cpp"
base_url = "http://localhost:8080/v1"
model = "flashnext"
env = { KODA_MAX_CONTEXT_TOKENS = "262144", KODA_REASONING_EFFORT = "xhigh" }

