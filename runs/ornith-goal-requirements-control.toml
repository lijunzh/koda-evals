# The baseline for runs/ornith-goal-requirements.toml: the same task as a
# plain prompt, with no goal, on the same build. Three repeats.
#   bin/serve-gguf ornith
#   cargo run --release -- run runs/ornith-goal-requirements-control.toml
name = "ornith-goal-requirements-control"
tasks = ["behaviour-goal-requirements-control"]
repeats = 3
jobs = 1

[[variants]]
name = "plain"
ref = "833022d"  # feat/goal-guards, on feat/exec-goal

[[models]]
name = "ornith"
provider = "llama-cpp"
base_url = "http://localhost:8080/v1"
model = "ornith"
env = { KODA_MAX_CONTEXT_TOKENS = "131072" }
