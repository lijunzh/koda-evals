# Screen of behaviour-spec-after-compact and its control on Haiku 5.5
# (Lijun's yes, 2026-11-09), Koda at f200ee1 (main after lijunzh/koda#1547).
# The task pins its own 32K window; the control runs at Haiku's 1M. Paid API
# calls, estimated $1-3.
#   ./target/release/koda-eval run runs/spec-after-compact-haiku.toml
#
# Result, 20261109T170022Z: 6 of 6. The task compacted 2, 2 and 3 times,
# with compaction 39-47% of each run's time, and took 1m29s-1m48s at
# 21-26K tokens. The control never compacted, peaking at 32-33K, just past
# the task's window, and took 41-46s at 9-10K tokens. On Haiku the rules
# survive compaction, so the task is a regression check on Koda's
# compaction (summary and re-read), not a model separator.
name = "spec-after-compact-haiku"
tasks = ["behaviour-spec-after-compact", "behaviour-spec-after-compact-control"]
repeats = 3
jobs = 3
memory = "none"

[[variants]]
name = "koda"
ref = "f200ee1"  # main after lijunzh/koda#1547

[[models]]
name = "haiku"
provider = "anthropic"
model = "claude-haiku-5-5"
