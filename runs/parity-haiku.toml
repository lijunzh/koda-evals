# 0.6.0's bar on Haiku: Koda against Claude Code on the same model, the 31
# `suite` tasks × 3, both reading the short memory/rust-project.md. The two
# agents' runs interleave task by task, so --jobs 3 contends them equally.
# Koda's runs are paid API calls; Claude Code's use the subscription and no
# API key (see bin/claude-as-koda). Each run needs Lijun's yes. `ref` is
# pinned to the release candidate.
#
# Each agent keeps its own defaults, since the question is what a user gets.
# Both run Haiku at effort `medium`. Koda sends no effort, so Haiku 5.5's API
# default of `medium` applies. Claude Code 2.1.296 sends `medium` with
# adaptive thinking (captured against a local stub on 2026-11-02). From
# lijunzh/koda#1516 on, Koda sends that `medium` itself, the same level.
#   ./target/release/koda-eval run runs/parity-haiku.toml
name = "parity-haiku"
repeats = 3
tags = ["suite"]
jobs = 3
memory = "memory/rust-project.md"

[[variants]]
name = "koda"
ref = "522daac5ab7e76d15cc46b4bccafd31702c99e2f"  # the 0.6.0 release candidate, after the tool fixes (lijunzh/koda#1511-#1514)

[[variants]]
name = "claude-code"
bin = "~/repo/koda-evals/bin/claude-as-koda"

[[models]]
name = "haiku"
provider = "anthropic"
model = "claude-haiku-5-5"
# Claude Code reads the project's CLAUDE.md only with this; koda ignores it.
env = { CLAUDE_AS_KODA_MEMORY = "project" }
