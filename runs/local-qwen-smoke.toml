# The four seed tasks once each against Qwen3-Coder-Next in LM Studio,
# to check the local model is usable before building the suite.
# LM Studio must have `qwen/qwen3-coder-next` loaded. Then:
#   cargo run -- run runs/local-qwen-smoke.toml
name = "local-qwen-smoke"
tasks = ["kata-largest", "kata-preview-utf8", "strip-quotes-lone-quote", "think-tag-multibyte"]
repeats = 1

[[variants]]
name = "v0.4.0"
ref = "v0.4.0"

[[models]]
name = "qwen3-coder-next"
provider = "lm-studio"
base_url = "http://localhost:1234/v1"
model = "qwen/qwen3-coder-next"
