# Client API PR 4 check (Lijun: "Yes, run it", 2026-11-13): the 20 `core`
# tasks once each on lijunzh/koda#1589, `koda exec --json` in place of
# `stream-json`, read through this branch's protocol 2 capture. A regression
# check, not a measurement, with the settings of haiku-064-recheck (20 of 20
# at 0.6.4). Paid API calls; that run cost about $0.95 (first quoted as $0.30).
#   ./target/release/koda-eval run runs/haiku-1589-check.toml
#
# Result, 20261113T161919Z: 20 of 20, as at 0.6.4; every record read from
# protocol 2 (protocol_version 2, no unparsed lines). About $1.45 against
# the 0.6.4 run's $0.95, priced per call (91 and 68 calls over 100K tokens, at
# Haiku's 5x rate; first quoted as $0.40 and $0.30, all at the lower rate):
# 235 model calls against 210, most of the difference in
# compact-reasoning-summary (106 calls against 82). Agent
# time 41 minutes against 24, all in two runs' Bash commands that Haiku chose
# and Koda timed out: a `find /` over the disk (120 s, kata-api-migration-tests)
# and `cargo test --workspace` on the task's project (600 s, then rerun in the
# background, compact-reasoning-summary). No time limits, compactions or
# blocked actions; 13 approval requests, 1 destructive; 7 edit rejections.
name = "haiku-1589-check"
repeats = 1
tags = ["core"]
jobs = 3
memory = "memory/rust-project.md"

[[variants]]
name = "koda"
ref = "09bf99b"  # head of lijunzh/koda#1589 (on #1588)

[[models]]
name = "haiku"
provider = "anthropic"
model = "claude-haiku-5-5"
