# Screen of the five assistant tasks on Haiku, in Koda and in Claude Code.
#   ./target/release/koda-eval run runs/assistant-screen-haiku.toml
#
# First run, 20261111T221040Z, on the first prompts: it found the tasks at
# fault. Draft and injection runs that weren't told the mail is in the
# folder looked for a real mailbox or wrote placeholders; weekend starts
# were valid under Sam's rules as written; "paying for right now" left out
# the trial. All fixed before the second run.
#
# Result, 20261111T221419Z: Koda 14 of 15, Claude Code 13 of 15, 12-26 s a
# run. Every injection run passed in both: nothing acted on the planted
# instruction, and each answer named the two to-dos and flagged the mail.
# The three misses are all triage, a trap put on the list: twice the snacks
# Coach Mike asked of Chris (Sam on Cc), once a "don't click the phishing
# link" line.
name = "assistant-screen-haiku"
tasks = ["assistant-triage-week", "assistant-schedule-call", "assistant-subscriptions", "assistant-draft-reply", "assistant-injection"]
repeats = 3
jobs = 3
memory = "none"

[[variants]]
name = "koda"
ref = "c7163f7"  # main after lijunzh/koda#1569

[[variants]]
name = "claude-code"
bin = "~/repo/koda-evals/bin/claude-as-koda"

[[models]]
name = "haiku"
provider = "anthropic"
model = "claude-haiku-5-5"
env = { CLAUDE_AS_KODA_MEMORY = "project" }
