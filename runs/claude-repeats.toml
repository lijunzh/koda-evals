# v2 exercise: build koda from the `main` ref, run the katas twice each
# against Claude, and read the report's pass^2 and per-task grid.
#   cargo run -- run runs/claude-repeats.toml
name = "claude-repeats"
tags = ["kata"]
repeats = 2

[[variants]]
name = "main"
ref = "main"

[[models]]
name = "sonnet"
provider = "anthropic"
model = "claude-sonnet-5-5"
# Explicit until koda's --provider implies the provider's URL.
base_url = "https://api.anthropic.com"
