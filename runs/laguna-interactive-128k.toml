# laguna: all ten tasks, once, under the interactive budget (each task's own
# 15-20 minute limit) with the 128K window decided on 2026-10-29 for every
# local configuration. This is the aligned fast-seat baseline; the 64K
# screens before it are not comparable on context.
#   omlx start
#   cargo run --release -- run runs/laguna-interactive-128k.toml
name = "laguna-interactive-128k"
repeats = 1

[[variants]]
name = "main"
ref = "main"

[[models]]
name = "laguna"
provider = "lm-studio"
base_url = "http://127.0.0.1:8123/v1"
model = "mlx-community/Laguna-S-2.1-oQ4e"
env = { KODA_MAX_CONTEXT_TOKENS = "131072" }
