# Does running side by side shorten a local run without changing its results?
# Twelve short tasks Ornith passes every time, with only `jobs` changing
# across parallel-ornith-jobs1, -jobs3 and -jobs2. Second of the three, in that order, so
# drift over the session doesn't line up with concurrency. Only after
# bin/lms-parallel-probe clears its bar. Unload only the model you loaded.
#   lms load ornith-1.5-35b-a3b --identifier ornith -c 131072 --parallel 4 -y
#   ./target/release/koda-eval run runs/parallel-ornith-jobs3.toml
name = "parallel-ornith-jobs3"
repeats = 3
jobs = 3
tasks = ["kata-largest", "kata-api-migration", "kata-utf8-sweep", "strip-quotes-lone-quote", "loop-guard-char-boundary", "think-tag-multibyte", "behaviour-answer-vs-act", "behaviour-shell-safety", "behaviour-pre-existing-failure", "behaviour-validation-fidelity", "behaviour-frugal-reads", "behaviour-act-on-given-info"]

[[variants]]
name = "main"
ref = "afb7716d02a5551ef262b3522303d37561569174"

[[models]]
name = "ornith"
provider = "lm-studio"
base_url = "http://localhost:1234/v1"
model = "ornith"
env = { KODA_MAX_CONTEXT_TOKENS = "131072" }
