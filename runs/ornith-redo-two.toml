# ornith: redo of the two tasks whose definitions changed on 2026-10-30
# after Ornith's repeat set had already graded them (koda-evals f60786c):
# behaviour-delegate-or-not grew from five to twelve modules at a 300 s
# wall, and behaviour-shell-safety-control swapped `tool_count Bash min=1`
# for a test-run-before-final-message rule. Flint and Laguna load tasks/
# when their sets start, so they grade the new definitions; these six rows
# bring Ornith level with them. Same pin, window and budget as
# runs/ornith-repeats-128k.toml. Queued behind the chain, not run during it.
#   lms load ornith-1.5-35b-a3b --identifier ornith -c 131072 -y
#   cargo run --release -- run runs/ornith-redo-two.toml --jobs 1
name = "ornith-redo-two"
repeats = 3
tasks = ["behaviour-delegate-or-not", "behaviour-shell-safety-control"]

[[variants]]
name = "main"
ref = "4926824"

[[models]]
name = "ornith"
provider = "lm-studio"
base_url = "http://localhost:1234/v1"
model = "ornith"
env = { KODA_MAX_CONTEXT_TOKENS = "131072" }
