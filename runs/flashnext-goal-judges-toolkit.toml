# The goal-judge A/B again, on a task with more work than a turn holds
# (Lijun: "Hold a bigger task first"): behaviour-goal-fix-suite was done in
# one turn by all ten runs of flashnext-goal-judges, so the goal loop never
# ran. Same build, lijunzh/koda 833022d (#1729 on #1728): goals in koda
# exec, max_goal_token_budget, and the hold after eight turns with no tool
# call. Five repeats each.
#   bin/serve-gguf flashnext
#   cargo run --release -- run runs/flashnext-goal-judges-toolkit.toml
#
# Stopped after three runs, 20261120T110909Z (Lijun: "If the first three
# runs of the current test all end up in one turn, we don't have to wait"):
# self r1-r3 passed in 9m46s, 6m23s and 8m00s (522K, 403K, 504K tokens),
# each finishing the 24 fixes and 61 lint problems in its first turn and
# marking the goal complete. More work in a turn isn't what makes a goal
# matter on Flash-Next; runs/flashnext-goal-requirements*.toml test where it
# should: requirements a model leaves out.
name = "flashnext-goal-judges-toolkit"
tasks = ["behaviour-goal-toolkit"]
repeats = 5
jobs = 1

[[variants]]
name = "self"
ref = "833022d"  # feat/goal-guards, on feat/exec-goal

[[variants]]
name = "evaluator"
ref = "833022d"
args = ["-c", "goal_judge=evaluator"]

[[models]]
name = "flashnext"
provider = "llama-cpp"
base_url = "http://localhost:8080/v1"
model = "flashnext"
env = { KODA_MAX_CONTEXT_TOKENS = "262144", KODA_REASONING_EFFORT = "xhigh" }
