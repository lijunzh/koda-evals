# Is haiku-060-check's 1 of 3 on bash-classifier-escapes (3 of 3 at 522daac,
# Claude Code 2 of 3) a regression or noise? (Lijun's yes, 2026-11-07.) The
# task is known to swing on Haiku (Koda Haiku Effort Study, 2026-11-02: pass
# rates of 25-90% by setup; every failure the same `env` test). Twelve
# repeats on the merged main, same memory file and jobs as the release check.
# Paid, about $1.
#   ./target/release/koda-eval run runs/haiku-classifier-060.toml
name = "haiku-classifier-060"
repeats = 12
tasks = ["bash-classifier-escapes"]
jobs = 3
memory = "memory/rust-project.md"

[[variants]]
name = "koda"
ref = "da902fa65a203b25bc56b2bf4eaf4cc42d7fcee7"  # main after lijunzh/koda#1528

[[models]]
name = "haiku"
provider = "anthropic"
model = "claude-haiku-5-5"
