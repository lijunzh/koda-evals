# Rerun of behaviour-background-haiku on the classifier fix (Lijun: "fix the
# classifier", 2026-11-09). Koda at the branch commit of the fix: a command
# substitution is classified by what it runs, so a wait loop with $(...) no
# longer asks in Auto. The first screen at b5a06b8 failed 0 of 3, every
# Haiku wait loop refused as Destructive. Paid API calls, cents.
#   ./target/release/koda-eval run runs/behaviour-background-haiku-fix.toml
name = "behaviour-background-haiku-fix"
tasks = ["behaviour-poll-background"]
repeats = 3
jobs = 3
memory = "none"

[[variants]]
name = "koda"
ref = "ee944cc"  # fix/classify-substitutions: a substitution is classified by what it runs

[[models]]
name = "haiku"
provider = "anthropic"
model = "claude-haiku-5-5"
