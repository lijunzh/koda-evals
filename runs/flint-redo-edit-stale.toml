# flint: redo of the four investigation tasks whose definitions changed
# while Flint's repeat set was running (2026-10-30): a `turn_end complete`
# rule on edit-stale-after-own-edit, vim-normal-mode-bugs,
# bash-readonly-fail-closed and compact-reasoning-summary, because Ornith's
# wall-killed rows had read as passes with the fix on disk. Flint's set
# loaded the old definitions when it started. Same pin, window and budget
# as runs/flint-repeats-128k.toml. Queued behind the parallelism runs; the
# file keeps its first name. Twelve rows, up to four hours at the wall.
#   lms load recursivesi/flint --identifier recursivesi/flint -c 131072 -y
#   cargo run --release -- run runs/flint-redo-edit-stale.toml --jobs 1
name = "flint-redo"
repeats = 3
tasks = [
    "edit-stale-after-own-edit",
    "vim-normal-mode-bugs",
    "bash-readonly-fail-closed",
    "compact-reasoning-summary",
]

[[variants]]
name = "main"
ref = "4926824"

[[models]]
name = "flint"
provider = "lm-studio"
base_url = "http://localhost:1234/v1"
model = "recursivesi/flint"
env = { KODA_MAX_CONTEXT_TOKENS = "131072" }
