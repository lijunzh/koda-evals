# 0.7.8 release check (Lijun: "yes to haiku test", 2026-11-22, with the cost
# stated, about $0.12): the 19 `core` tasks once each on the release
# candidate, 17315a1: the release's cargo update on lijunzh/koda f519716
# (#1743). Since the baseline in runs/haiku-078-check.toml (96de17d): `koda
# mcp login --scopes`, `koda exec` saying why an MCP server didn't start, two
# MCP settings read from config.toml (#1743), and seven patch updates to the
# lock file. Same settings. Paid API calls.
#   ./target/release/koda-eval run runs/haiku-078-recheck.toml
#
# Result, 20261122T183544Z: 19 of 19, no compactions, peak context 82% of the
# window (bash-readonly-fail-closed, 95K). Slowest: bash-readonly-fail-closed
# 5m55s, bash-classifier-escapes 2m46s, kata-api-migration-tests 2m25s. 5.03M
# prompt tokens, of which 4.68M read from cache and 345K written to it, 99K
# out, 148 calls: about $0.14. Released as v0.7.8 (lijunzh/koda b5e58ae), whose
# code differs from 17315a1 only in version numbers and one test file (#1745).
# The three MCP mail tasks on Flash-Next were not run for this release.
