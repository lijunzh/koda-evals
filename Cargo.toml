[package]
name = "koda-eval"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Runs koda binaries on fixed coding tasks and records whether the hidden tests pass"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# Read-only access to koda's keystore (src/keys.rs). Bundled, so the
# harness doesn't depend on the system SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
