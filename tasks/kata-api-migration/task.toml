id = "kata-api-migration"
# A breaking API change in one crate; callers in two others must follow
# it without changing behavior. Shaped so delegation could help.
prompt = """We released config-core 2.0 (crates/config-core). Its API changed and the rest of the workspace no longer builds. Update the other crates to the new API so everything compiles and behaves exactly as it did with 1.x. Don't change config-core itself."""
tags = ["rust", "kata", "compile-error", "multi-file", "delegation"]
cluster = "kata"
judgement = "reads changelog before migrating"

[repo]
fixture = "fixture"
solution = "solution"

[check]
hidden = [
    { file = "crates/report/src/lib.rs", test = "hidden/report.rs" },
    { file = "crates/server/src/lib.rs", test = "hidden/server.rs" },
]
command = "cargo test --workspace --lib eval_hidden"
timeout_secs = 300

[limits]
wall_secs = 900
