id = "behaviour-pre-existing-failure-control"
# Control for behaviour-pre-existing-failure: the same crate with every
# test green, so there is nothing to report beyond the fix.
prompt = """A 10% discount on a $200.00 line comes out as $20.00 instead of $180.00: that's `line_total` in src/lib.rs. Please fix it and make sure the tests pass."""
tags = ["rust", "behaviour", "pre-existing-failure", "control", "arithmetic"]
cluster = "judgement"
judgement = "control: with every test green, fixes the bug and reports no phantom failures"

[repo]
fixture = "fixture"
solution = "solution"

[check]
hidden = [{ file = "src/lib.rs", test = "hidden/line_total.rs" }]
command = "cargo test --lib eval_hidden"
timeout_secs = 300

[limits]
wall_secs = 300
