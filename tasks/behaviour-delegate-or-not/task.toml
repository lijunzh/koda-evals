id = "behaviour-delegate-or-not"
# Retired as a judgement 2026-11-01 (Lijun): no configuration delegated
# here, 0 of 20 runs across Haiku, Sonnet, Opus, Ornith, Flint and Glimmer,
# and Haiku fixed all twelve alone in 22 seconds, which is the right call.
# It now measures what a model chooses unprompted and passes on the hidden
# tests alone. Kept, not deleted: the -delegate and -solo twins use this
# fixture, and old run files name it. Leave it out of suite run files.
#
# Twelve independent one-line fixes in twelve modules, the shape of
# kata-utf8-sweep, with a worker agent available in agents/ on the same
# model.
# Control: behaviour-delegate-or-not-control (one small fix, same worker).
# Enlarged from five modules on 2026-10-30: at five, Opus (22 s) and
# Ornith (about a minute, 3 of 3 repeats) fixed everything alone and were
# right to, so the should-row measured a preference, not a benefit. Koda
# runs InvokeAgent workers concurrently and LM Studio 0.4 serves parallel
# requests (lms load --parallel), so at twelve pieces inside a 300 s wall
# delegation was expected to be the way to finish in budget.
prompt = """Several functions in this crate panic on empty input (an empty string or an empty slice). Find and fix every one of them, keeping each function's documented behaviour."""
tags = ["rust", "measurement", "delegate-or-not", "panic", "multi-file", "delegation"]
cluster = "judgement"
judgement = "measurement: whether a model delegates a twelve-piece sweep unprompted"

[repo]
fixture = "fixture"
solution = "solution"

[check]
hidden = [
    { file = "src/average.rs", test = "hidden/average.rs" },
    { file = "src/first_line.rs", test = "hidden/first_line.rs" },
    { file = "src/first_word.rs", test = "hidden/first_word.rs" },
    { file = "src/header.rs", test = "hidden/header.rs" },
    { file = "src/initial.rs", test = "hidden/initial.rs" },
    { file = "src/last_word.rs", test = "hidden/last_word.rs" },
    { file = "src/longest.rs", test = "hidden/longest.rs" },
    { file = "src/median.rs", test = "hidden/median.rs" },
    { file = "src/mode.rs", test = "hidden/mode.rs" },
    { file = "src/percent.rs", test = "hidden/percent.rs" },
    { file = "src/second.rs", test = "hidden/second.rs" },
    { file = "src/span.rs", test = "hidden/span.rs" },
]
command = "cargo test --lib eval_hidden"
timeout_secs = 300

[[check.transcript]]
type = "turn_end"
kind = "complete"

[limits]
wall_secs = 300

[run]
agents_dir = "agents"
