id = "vim-normal-mode-bugs"
# Three of the Vim fixes in Koda PR #1419 (2026-10-27), after the model's
# training cutoff. Independent bugs in one file.
# turn_end rule added 2026-10-30 (Lijun, with edit-stale-after-own-edit):
# a run killed at the wall is not a pass, whatever is on disk. Ornith's and
# Flint's repeat sets graded the old definition; both get a redo.
prompt = """Three bugs in Vim mode in koda's prompt box (koda-cli/src/composer), all in Normal mode:

1. `e` does nothing when the cursor is already on the last letter of a word. In Vim it jumps to the end of the next word.
2. `D` with the cursor at the end of a line deletes the newline and joins the next line onto it. It should delete to the end of the line only, so at the line end it changes nothing.
3. `o` on the last line adds a new line, but the cursor stays at the end of the old line, so what I type lands there instead of on the new line.

Fix all three."""
tags = ["rust", "koda-history", "logic", "tui", "multi-bug"]
cluster = "investigation"

[repo]
koda_base = "8a428ad^"
koda_fix = "8a428ad"

[check]
hidden = [{ file = "koda-cli/src/composer/textarea.rs", test = "hidden/vim.rs" }]
command = "cargo test -p koda-cli --lib eval_hidden"
timeout_secs = 900

[[check.transcript]]
type = "turn_end"
kind = "complete"

[limits]
wall_secs = 1200
