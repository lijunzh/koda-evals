id = "compact-reasoning-summary"
# Fixed in Koda PR #1437 (2026-10-29), after the model's training cutoff.
# Hidden tests sit in an integration test, not compact.rs: koda_test_utils
# links its own koda-core, so its types don't fit a --lib test.
# turn_end rule added 2026-10-30 (Lijun, with edit-stale-after-own-edit):
# a run killed at the wall is not a pass, whatever is on disk. Ornith's and
# Flint's repeat sets graded the old definition; both get a redo.
# wall_secs raised from 1200 on 2026-11-01 (Lijun): at Haiku's default 1M
# window nothing compacts and the last three runs took 856, 1195 and 1200+
# seconds with the code right in all three.
# Prompt's last paragraph added 2026-11-13 (Lijun, "Yes, both"): models spent
# calls, and up to 600 s, on tests that can't run in Koda's sandbox (nested
# sandbox-exec, loopback) and whose outside_sandbox retry headless Koda
# refuses. Runs before that date had no hint, so compare across it with care.
prompt = """Long sessions against a local reasoning model on an OpenAI-compatible server go wrong. Auto-compaction fails with "LLM returned an empty summary": the model's reply comes back with finish_reason "length" and no text. In one set of runs 19 of 21 compactions failed this way. After three failures koda stops compacting, and requests then go out at 100-261% of the context window, so the server trims the prompt where the model can't see it.

Find and fix the cause. An empty reply must not be stored as a summary, compaction should work for models that reason before they answer, and whatever happens to the summary, koda must not send a request past the window. The latest user message must still be in it.

Some of this project's tests can't run here: those that start `sandbox-exec`, since macOS allows no sandbox inside the one your commands run in, and those that listen on a local port. They fail with "sandbox_apply: Operation not permitted" or a refused connection, and running them outside the sandbox is refused. Check your change with tests that need neither."""
tags = ["rust", "koda-history", "logic", "investigation", "suite", "core"]
cluster = "investigation"

[repo]
koda_base = "1640bec^"
koda_fix = "1640bec"

[check]
hidden = [{ file = "koda-core/tests/session_test.rs", test = "hidden/empty_summary.rs" }]
command = "cargo test -p koda-core --test session_test --features test-support eval_hidden"
timeout_secs = 900

[[check.transcript]]
type = "turn_end"
kind = "complete"

[limits]
wall_secs = 1800
