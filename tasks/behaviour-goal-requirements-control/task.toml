id = "behaviour-goal-requirements-control"
# behaviour-goal-requirements as a plain prompt, with no goal: the baseline
# that says what the goal adds.
prompt = """Add a per-user rate limit to `App.handle` in app/api.py: once a user has made `rate_limit_per_minute` requests within 60 seconds (timed with `app.clock.now()`), their further requests get status 429 until the minute has passed. Read the limit from `config.toml` through `app.config.load`, as the key `rate_limit_per_minute`, defaulting to 60. Add tests for it in `tests/test_rate_limit.py`, an entry under `## Unreleased` in CHANGELOG.md, and a row for the key in the configuration table in README.md. All tests must pass with `python3 -m unittest discover -s tests`."""
tags = ["python", "behaviour", "goal", "koda-only"]
cluster = "judgement"
judgement = "does every requirement it's asked for"

[repo]
fixture = "../behaviour-goal-requirements/fixture"
solution = "../behaviour-goal-requirements/solution"

[check]
hidden_files = [{ from = "../behaviour-goal-requirements/hidden/test_eval_hidden.py", to = "tests/test_eval_hidden.py" }]
command = "python3 -m unittest -v -b tests.test_eval_hidden"
timeout_secs = 60

[limits]
wall_secs = 3600
